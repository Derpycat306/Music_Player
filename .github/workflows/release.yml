name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous build output
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item -Path "dist" -Recurse -Force
          }

      - name: Build release assets
        run: npm run release:build

      - name: Create or update draft release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "The release tag was not provided by the workflow event."
          }

          $assets = @(Get-ChildItem -Path "dist" -File |
            Where-Object {
              $_.Name -like "*.exe" -or
              $_.Name -like "*.blockmap" -or
              $_.Name -like "latest*.yml"
            } |
            Sort-Object Name)

          if ($assets.Count -eq 0) {
            throw "No installer, blockmap, or update metadata was generated."
          }

          if (-not ($assets.Name | Where-Object { $_ -like "*.exe" })) {
            throw "The release build did not generate a Windows installer."
          }
          if (-not ($assets.Name | Where-Object { $_ -like "*.blockmap" })) {
            throw "The release build did not generate update blockmaps."
          }
          if (-not ($assets.Name | Where-Object { $_ -like "latest*.yml" })) {
            throw "The release build did not generate update metadata."
          }

          $metadata = Get-Content -Path "dist\latest.yml" -Raw
          $installerName = [regex]::Match($metadata, '(?m)^\s+- url:\s*(.+?)\s*$').Groups[1].Value
          if (-not $installerName -or $installerName -notin $assets.Name) {
            throw "Update metadata does not match a generated installer asset."
          }

          Write-Host "Updating release tag: $tag"
          Write-Host "Fresh release assets:"
          $assets | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

          $existingAssets = @(gh release view $tag --json assets --jq '.assets[].name' 2>$null)
          $releaseExists = $LASTEXITCODE -eq 0
          if (-not $releaseExists) {
            gh release create $tag --draft --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft release for $tag."
            }
          }

          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload release assets for $tag."
          }

          if ($releaseExists) {
            foreach ($asset in $existingAssets) {
              if ($asset -in $assets.Name) { continue }
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove old release asset $asset."
              }
            }
          }

          $publishedAssets = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify uploaded release assets for $tag."
          }
          $unexpectedAssets = @($publishedAssets | Where-Object { $_ -notin $assets.Name })
          $missingAssets = @($assets.Name | Where-Object { $_ -notin $publishedAssets })
          if ($unexpectedAssets.Count -gt 0 -or $missingAssets.Count -gt 0) {
            throw "Release asset set does not match the fresh build. Unexpected: $($unexpectedAssets -join ', '); missing: $($missingAssets -join ', ')."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
