name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npm run dist:win

      - name: Create one GitHub release with all artifacts
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path dist -File | Where-Object {
            $_.Name -match '\.(exe|blockmap|yml)$'
          }
          gh release create "$env:GITHUB_REF_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Music Player $env:GITHUB_REF_NAME" `
            --generate-notes `
            $assets.FullName
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}